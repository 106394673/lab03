<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk Appointment</title>
</head>
<body>

    <a href="http://www.swin.edu.au">
        <img 
            src="logo.png"
            alt="Swinburne University Logo"
            height="50"
            width="100"
            >
    </a>

    <h1>CWA Help Desk Appointment</h1>

    <p>
        The Help Desk is located in ATC620.
        Open 10:30 to 19:00 Monday to Friday.
    </p>

    <p>
        Check Blackboard for when CWA tutors will be there.
    </p>

    <form action="#" method="post">
        <fieldset >

            <legend>Student details</legend>

            <label for="studentid">Student ID</label>
            <input 
                type="text" 
                id="studentid" 
                name="studentid"
                pattern="[0-9]{7,10}"
                required
            >
            <br>
            <br>

            <label for="givenname">Given name</label>
            <input 
                type="text" 
                id="givenname" 
                name="givenname"
                pattern="[A-Za-z]{1,15}"
                required
            >

            <label for="familyname">Family name</label>
            <input 
                type="text" 
                id="familyname" 
                name="familyname"
                pattern="[A-Za-z]{1,15}"
                required
            >
        </fieldset>

        <fieldset>

            <legend>Your unit</legend>

            <label for="cos10011">COS10011</label>
            <input 
                type="radio" 
                id="cos10011" 
                name="unit"
                value="COS10011"
                required
            >

            <label for="cos60004">COS60004</label>
            <input 
                type="radio" 
                id="cos60004" 
                name="unit"
                value="COS60004"
            >

            <label for="cos60007">COS60007</label>
            <input 
                type="radio" 
                id="cos60007" 
                name="unit"
                value="COS60007"
            >
            <br>
            <br>

            <label for="tutor">Tutor</label>
            <select id="tutor" name="tutor" required>
                <option value="">Please Select</option>
                <option value="John">John</option>
                <option value="Mary">Mary</option>
                <option value="David">David</option>
            </select>
        </fieldset>

        <fieldset>

            <legend>Issue</legend>

                <label for="html">HTML</label>
                    <input 
                        type="checkbox" 
                        id="html" 
                        name="issue"
                        value="HTML"
                        checked="checked"
                    >
                <label for="css">CSS</label>
                    <input 
                        type="checkbox" 
                        id="css" 
                        name="issue"
                        value="CSS"
                        checked="checked"
                    >
                <label for="javascript">JavaScript</label>
                    <input 
                        type="checkbox" 
                        id="javascript" 
                        name="issue"
                        value="JavaScript"
                    >
                <label for="php">PHP</label>
                    <input 
                        type="checkbox" 
                        id="php" 
                        name="issue"
                        value="PHP"

                    >
                <label for="mysql">MySQL</label>   
                    <input 
                        type="checkbox" 
                        id="mysql" 
                        name="issue"
                        value="MySQL"
                    >
                <br>
                <br>

                <label for="description">Description of Issue</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="Please describe your issue here"
                    rows="5"
                    cols="35"
                ></textarea>

                <br>
                <br>
        </fieldset>

        <fieldset>

            <legend>Preferred Date/Time</legend>

            <label for="date">Date</label>
            <input
                type="text"
                id="date"
                name="date"
                placeholder="dd/mm/yyyy"
                pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}"
                title="Enter the date in dd/mm/yyyy format."
                required
            >
            <br>

            <label for="time">Time</label>
            <input
                type="text"
                id="time"
                name="time"
                placeholder="00:00"
                pattern="([01][0-9]|2[0-3]):[0-5][0-9]"
                title="Enter the time in 24-hour format, for example 14:30."
                required
            >

        </fieldset>

        <input type="submit" value="Book">
        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
